<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Skidc · Blackboard</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #131a22; --panel2: #1a232e; --line: #243140;
    --txt: #d6e0ea; --muted: #7c8a9a; --accent: #4ea1ff; --good: #41d39a;
    --warn: #f3b34a; --bad: #ef6b6b; --origin: #8a7bff; --goal: #41d39a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.5 ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: 1px; }
  header .tag { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button, select { background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 0; height: calc(100vh - 53px); }
  .sidebar { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .proj { padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .proj:hover { background: var(--panel2); }
  .proj.sel { background: var(--panel2); border-left: 3px solid var(--accent); }
  .proj .t { font-weight: 600; }
  .proj .m { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); }
  .pill.active { color: var(--good); border-color: var(--good); }
  .pill.completed { color: var(--accent); border-color: var(--accent); }
  .pill.stopped { color: var(--warn); border-color: var(--warn); }
  .main { overflow-y: auto; padding: 18px 22px; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .sec { margin-bottom: 22px; }
  .sec h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 0 0 10px; }
  .node { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel); }
  .node .id { font-weight: 700; color: var(--accent); }
  .node.origin .id { color: var(--origin); }
  .node.goal .id { color: var(--goal); }
  .node .d { margin-top: 4px; white-space: pre-wrap; }
  .intent { border-left: 3px solid var(--warn); }
  .intent.done { border-left-color: var(--good); }
  .intent .meta { color: var(--muted); font-size: 12px; margin-top: 5px; display: flex; gap: 10px; flex-wrap: wrap; }
  .arrow { color: var(--muted); }
  .hint { border-left: 3px solid var(--origin); }
  .new { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 18px; }
  .new input, .new textarea { width: 100%; background: var(--bg); color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px; font: inherit; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
</style>
</head>
<body>
<header>
  <h1>SKIDC</h1>
  <span class="tag">blackboard state-space search</span>
  <div class="spacer"></div>
  <button id="newBtn">+ New project</button>
  <button id="refreshBtn">⟳ Refresh</button>
  <span class="tag" id="clock"></span>
</header>
<div class="wrap">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"><div class="empty">Select a project, or create one.</div></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let selected = null;
let showNew = false;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  const ct = r.headers.get("content-type") || "";
  return ct.includes("application/json") ? r.json() : r.text();
}

async function loadProjects() {
  const projects = await api("/projects");
  const sb = $("sidebar");
  sb.innerHTML = "";
  if (!projects.length) sb.innerHTML = '<div class="empty">No projects yet.</div>';
  for (const p of projects) {
    const el = document.createElement("div");
    el.className = "proj" + (p.id === selected ? " sel" : "");
    el.innerHTML = `<div class="t">${esc(p.title)}</div>
      <div class="m"><span class="pill ${p.status}">${p.status}</span>
      <span>${p.fact_count} facts</span><span>${p.intent_count} intents</span>
      ${p.reason ? '<span class="pill">reasoning</span>' : ''}</div>`;
    el.onclick = () => { selected = p.id; showNew = false; render(); };
    sb.appendChild(el);
  }
  $("clock").textContent = new Date().toLocaleTimeString();
}

async function render() {
  await loadProjects();
  const main = $("main");
  if (showNew) return renderNew(main);
  if (!selected) { main.innerHTML = '<div class="empty">Select a project, or create one.</div>'; return; }
  let d;
  try { d = await api(`/projects/${selected}`); }
  catch { main.innerHTML = '<div class="empty">Project not found.</div>'; selected = null; return; }

  const facts = d.facts.filter(f => f.id !== "origin" && f.id !== "goal");
  const origin = d.facts.find(f => f.id === "origin");
  const goal = d.facts.find(f => f.id === "goal");

  main.innerHTML = `
    <div class="sec">
      <h2>${esc(d.project.title)} · ${d.project.status}</h2>
      <div class="node origin"><span class="id">origin</span><div class="d">${esc(origin?.description || "")}</div></div>
      <div class="node goal"><span class="id">goal</span><div class="d">${esc(goal?.description || "")}</div></div>
    </div>
    ${d.hints.length ? `<div class="sec"><h2>Hints</h2>${d.hints.map(h =>
      `<div class="node hint"><span class="id">${h.id}</span> <span class="arrow">by ${esc(h.creator)}</span><div class="d">${esc(h.content)}</div></div>`).join("")}</div>` : ""}
    <div class="sec"><h2>Facts (${facts.length})</h2>${facts.length ? facts.map(f =>
      `<div class="node"><span class="id">${f.id}</span><div class="d">${esc(f.description)}</div></div>`).join("") : '<div class="empty">No derived facts yet.</div>'}</div>
    <div class="sec"><h2>Intents (${d.intents.length})</h2>${d.intents.length ? d.intents.map(i => {
      const done = i.to != null;
      return `<div class="node intent ${done ? 'done' : ''}">
        <span class="id">${i.id}</span> <span class="arrow">${(i.from||[]).join(", ")} → ${i.to || "?"}</span>
        <div class="d">${esc(i.description)}</div>
        <div class="meta"><span>by ${esc(i.creator)}</span>${i.worker ? `<span>worker: ${esc(i.worker)}</span>` : ""}${done ? '<span style="color:var(--good)">concluded</span>' : '<span style="color:var(--warn)">open</span>'}</div>
      </div>`;
    }).join("") : '<div class="empty">No intents yet.</div>'}</div>
    ${d.project.status === "active" ? `<div class="sec"><button onclick="addHint()">+ Add hint</button>
      <button onclick="stopProj()">Stop project</button></div>` : ""}`;
}

function renderNew(main) {
  main.innerHTML = `<div class="new">
    <label>Title</label><input id="nt" placeholder="recon target X"/>
    <label>Origin (known starting point)</label><textarea id="no" rows="2" placeholder="target IP, system, known state"></textarea>
    <label>Goal (success condition)</label><textarea id="ng" rows="2" placeholder="get a shell, capture the flag, prove X"></textarea>
    <div class="row"><button onclick="createProj()">Create</button><button onclick="showNew=false;render()">Cancel</button></div>
  </div>`;
}

async function createProj() {
  const body = { title: $("nt").value || "untitled", origin: $("no").value || "unknown", goal: $("ng").value || "unknown" };
  const d = await api("/projects", { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify(body) });
  selected = d.project.id; showNew = false; render();
}
async function addHint() {
  const content = prompt("Hint content:"); if (!content) return;
  await api(`/projects/${selected}/hints`, { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify({content, creator: "human"}) });
  render();
}
async function stopProj() {
  await api(`/projects/${selected}/status`, { method: "PUT", headers: {"content-type":"application/json"}, body: JSON.stringify({status: "stopped"}) });
  render();
}
function esc(s) { return (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("newBtn").onclick = () => { showNew = true; selected = null; render(); };
$("refreshBtn").onclick = render;
render();
setInterval(() => { if (!showNew) render(); }, 4000);
</script>
</body>
</html>
