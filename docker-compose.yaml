services:
  skidc-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: skidc-app
    pull_policy: never
    container_name: skidc-server
    ports:
      - "8000:8000"
    volumes:
      - ./datas/skidc/:/root/.local/share/skidc/
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "skidc", "serve", "--host", "0.0.0.0", "--no-access-log"]

  skidc-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: skidc-app
    pull_policy: never
    container_name: skidc-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/skidc/dispatch.yaml
    depends_on:
      skidc-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "skidc", "dispatch", "--config", "dispatch.yaml"]

  android-emulator:
    image: us-docker.pkg.dev/android-emulator-268719/images/30-google-x64-no-metrics:30.1.2
    profiles: ["android"]
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      ADBKEY: "${ANDROID_ADBKEY:-}"
      EMULATOR_PARAMS: "-no-window -no-audio -no-boot-anim -memory 3072 -cores 4"
    shm_size: 2gb
    mem_limit: 5g
    cpus: 4
    networks: [android-lab]
    restart: unless-stopped

  android-bridge:
    image: skidc-android-bridge:latest
    pull_policy: never
    profiles: ["android"]
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./datas/android-artifacts:/artifacts:ro
      - ./datas/android-lab/adb:/var/lib/skidc/android-adb:ro
    environment:
      ANDROID_EMULATOR_SERIAL: "android-emulator:5555"
      ADB_VENDOR_KEYS: "/var/lib/skidc/android-adb"
    depends_on:
      android-emulator:
        condition: service_started
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /var/lib/skidc:size=128m,uid=10001,gid=10001
    networks: [android-lab]
    restart: unless-stopped

networks:
  android-lab:
    driver: bridge
